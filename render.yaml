# Render Deployment Configuration for Vasavi Temple
# See: https://render.com/docs/blueprint-spec

services:
  # ── Backend REST API ──────────────────────────────────────────
  - type: web
    name: vasavi-temple-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # ── Frontend Static Site ──────────────────────────────────────
  - type: web
    name: vasavi-temple-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://vasavi-temple-kadiyapulanka.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
